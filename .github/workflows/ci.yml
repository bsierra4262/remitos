# Remitos y Comprobantes — Intellihelp
# Integración continua: estilo, sintaxis, dependencias, pruebas unitarias y la
# batería completa (API e interfaz) contra MariaDB y php -S.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Estilo, sintaxis y dependencias
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, curl, dom, pdo_mysql
          tools: php-cs-fixer:3.64

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sintaxis PHP
        run: find app/api test -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Estilo PHP (PSR-12)
        run: php-cs-fixer fix --dry-run --diff --config=.php-cs-fixer.dist.php

      - name: Estilo JavaScript y CSS (Prettier)
        run: npx --yes prettier@3.3.3 --check "app/**/*.{js,css}" "test/**/*.js"

      - name: Sintaxis JavaScript
        run: for f in app/js/*.js test/unitarias/*.js; do node --check "$f"; done

      - name: Sintaxis Python (pruebas y herramientas)
        run: python3 -m py_compile test/*.py tools/*.py

      - name: Integridad de las dependencias incluidas
        run: sha256sum -c test/dependencias.sha256

      # Con «if» explícito: bash no aplica «set -e» a un comando negado con «!», así que
      # «! grep …» en una línea que no es la última no haría fallar el paso.
      - name: Sin secretos en el repositorio
        run: |
          if git ls-files | grep -E '(^|/)config\.php($|\.)|client_secret.*\.json$|\.(key|pem|p12|crt|csr)$'; then
            echo "::error::Hay un archivo de secretos versionado"; exit 1
          fi
          if git grep -nE '^-----BEGIN (RSA |EC |ENCRYPTED )?PRIVATE KEY-----$' -- ':!test/*'; then
            echo "::error::Hay una clave privada versionada"; exit 1
          fi

      - name: Pruebas unitarias (cálculos de la interfaz y del servidor)
        run: |
          node --test test/unitarias/calculos.test.js
          php test/unitarias/importes.test.php
          php test/unitarias/ithub.test.php

  # El hosting puede tener PHP 8.2: la sintaxis y las unitarias del servidor se prueban también ahí.
  php82:
    name: Compatibilidad con PHP 8.2
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, openssl, curl, dom, pdo_mysql
          coverage: none
      - name: Sintaxis y pruebas unitarias del servidor
        run: |
          find app/api test -name '*.php' -print0 | xargs -0 -n1 php -l
          php test/unitarias/importes.test.php
          php test/unitarias/ithub.test.php

  pruebas:
    name: Batería completa (API e interfaz)
    runs-on: ubuntu-24.04
    needs: calidad
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: testroot
          MARIADB_DATABASE: remitos_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      REMITOS_CONFIG: /tmp/config.test.php
      REMITOS_MYSQL: mariadb
      REMITOS_DB_PORT: '3306'
      REMITOS_DB_PASS: testroot
      REMITOS_DB: remitos_test
      REMITOS_CORREO_DIR: /tmp/correo
      REMITOS_ITHUB_URL: http://127.0.0.1:8767
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, curl, dom, pdo_mysql
          # Sin extensión de cobertura: la que trae la imagen desactiva el JIT con una
          # advertencia de arranque que el paso «Errores del servidor» toma como error.
          coverage: none
          ini-values: opcache.jit=disable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias de las pruebas
        run: |
          sudo apt-get update -q && sudo apt-get install -yq mariadb-client
          pip install -r test/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Configuración y esquema de pruebas
        run: |
          cat > /tmp/config.test.php <<'PHP'
          <?php
          return [
              'app_url' => 'http://127.0.0.1:8765',
              'db' => ['host' => '127.0.0.1', 'port' => 3306, 'name' => 'remitos_test', 'user' => 'root', 'pass' => 'testroot'],
              'master_key_hash' => hash('sha256', 'ith_test_master_key_0123456789abcdef'),
              'app_key' => str_repeat('ab', 32),
              'google' => ['client_id' => 'pruebas.apps.googleusercontent.com', 'client_secret' => 'secreto-de-pruebas', 'dominio' => 'intellihelp.tech', 'token_url' => 'http://127.0.0.1:8766/token'],
          ];
          PHP
          # Segunda instancia, con ITHub: la usa test_ithub.py contra un ITHub simulado en 8768.
          cat > /tmp/config.ithub.php <<'PHP'
          <?php
          $c = require '/tmp/config.test.php';
          $c['app_url'] = 'http://127.0.0.1:8767';
          $c['ithub'] = ['client_id' => 'remitos', 'client_secret' => 'secreto-de-pruebas', 'issuer' => 'http://127.0.0.1:8768'];
          return $c;
          PHP
          php app/api/cli/migrar.php

      - name: Servidor
        run: |
          mkdir -p "$REMITOS_CORREO_DIR"
          php -S 127.0.0.1:8765 -t app > /tmp/php-server.log 2>&1 &
          REMITOS_CONFIG=/tmp/config.ithub.php php -S 127.0.0.1:8767 -t app > /tmp/php-server-ithub.log 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8765/api/sesion.php >/dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:8765/api/sesion.php >/dev/null || { cat /tmp/php-server.log; exit 1; }

      - name: Pruebas
        run: python test/correr.py

      - name: Errores del servidor
        if: always()
        run: |
          ! grep -E 'PHP (Fatal|Parse|Warning|Notice|Deprecated)' /tmp/php-server.log /tmp/php-server-ithub.log

      - name: Registro del servidor (si algo falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: php-server-log
          path: /tmp/php-server*.log
          retention-days: 7
